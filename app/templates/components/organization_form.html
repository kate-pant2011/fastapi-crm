<h5 class="mb-3">
    Основная информация
</h5>

<div class="mb-3">

    <label class="form-label">
        Название
    </label>

    <input
        type="text"
        name="name"
        class="form-control"
        value="{{ template.name }}">

</div>

<div class="mb-3">

    <label class="form-label">
        ИНН
    </label>

    <input
        type="text"
        class="form-control"
        value="{{ template.inn }}"
        disabled>

    <div class="form-text">
        ИНН изменить нельзя.
    </div>

</div>

<hr>

<h5 class="mb-3">
    Реквизиты
</h5>

<div class="row">

    <div class="col-md-6 mb-3">

        <label class="form-label">
            КПП
        </label>

        <input
            type="text"
            name="kpp"
            class="form-control"
            value="{{ template.kpp or '' }}">

    </div>

    <div class="col-md-6 mb-3">

        <label class="form-label">
            ОГРН
        </label>

        <input
            type="text"
            name="ogrn"
            class="form-control"
            value="{{ template.ogrn or '' }}">

    </div>

    <div class="col-md-6 mb-3">

        <label class="form-label">
            ОКПО
        </label>

        <input
            type="text"
            name="okpo"
            class="form-control"
            value="{{ template.okpo or '' }}">

    </div>

    <div class="col-md-6 mb-3">

        <label class="form-label">
            ОКВЭД
        </label>

        <input
            type="text"
            name="okved"
            class="form-control"
            value="{{ template.okved or '' }}">

    </div>

    <div class="col-md-6 mb-3">

        <label class="form-label">
            ОКФС
        </label>

        <input
            type="text"
            name="okfs"
            class="form-control"
            value="{{ template.okfs or '' }}">

    </div>

    <div class="col-md-6 mb-3">

        <label class="form-label">
            ОКОПФ
        </label>

        <input
            type="text"
            name="okopf"
            class="form-control"
            value="{{ template.okopf or '' }}">

    </div>

    <div class="col-md-6 mb-3">

        <label class="form-label">
            ОКАТО
        </label>

        <input
            type="text"
            name="okato"
            class="form-control"
            value="{{ template.okato or '' }}">

    </div>

</div>

<hr>

<h5 class="mb-3">
    Адреса
</h5>

<div class="mb-3">

    <label class="form-label">
        Юридический адрес
    </label>

    <textarea
        name="legal_address"
        class="form-control"
        rows="2">{{ template.legal_address or '' }}</textarea>

</div>

<div class="mb-4">

    <label class="form-label">
        Фактический адрес
    </label>

    <textarea
        name="address"
        class="form-control"
        rows="2">{{ template.address or '' }}</textarea>

</div>

<hr>

<h5 class="mb-3">
    Контактная информация
</h5>

<div class="row">

    <div class="col-md-4 mb-3">

        <label class="form-label">
            Email
        </label>

        <input
            type="email"
            name="email"
            class="form-control"
            value="{{ template.email or '' }}">

    </div>

    <div class="col-md-4 mb-3">

        <label class="form-label">
            Телефон
        </label>

        <input
            type="text"
            name="telephone"
            class="form-control"
            value="{{ template.telephone or '' }}">

    </div>

    <div class="col-md-4 mb-3">

        <label class="form-label">
            Сайт
        </label>

        <input
            type="text"
            name="website"
            class="form-control"
            value="{{ template.website or '' }}">

    </div>

</div>

<hr>

<h5 class="mb-3">

</div>

<div class="mb-3">

<div class="mb-3">

<hr>

    <label class="form-label">

</div>
