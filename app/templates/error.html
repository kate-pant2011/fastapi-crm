{% extends "base.html" %}

{% block title %}
Ошибка
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-lg-8">

        <div class="card border-danger">

            <div class="card-header bg-danger text-white">

                <h4 class="mb-0">

                    ❌ Ошибка

                </h4>

            </div>

            <div class="card-body text-center py-5">

                <div class="display-2 mb-4">

                    ⚠️

                </div>

                <h5 class="mb-4">

                    {{ message | default("Произошла непредвиденная ошибка.") }}

                </h5>

                {% if return_url %}

                <a
                    href="{{ return_url }}"
                    class="btn btn-primary">

                    Вернуться

                </a>

                {% else %}

                <button
                    type="button"
                    class="btn btn-secondary"
                    onclick="history.back()">

                    Назад

                </button>

                {% endif %}

            </div>

        </div>

    </div>

</div>

{% endblock %}
