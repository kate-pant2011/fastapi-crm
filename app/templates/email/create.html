{% extends "base.html" %}

{% block title %}
Создание почтового аккаунта
{% endblock %}

{% block content %}

<h2 class="mb-4">
    Создание почтового аккаунта
</h2>

{% include "components/error_alert.html" %}

<form method="post" action="{{ create_url }}">

    <div class="mb-3">

        <label class="form-label">
            Email
        </label>

        <input
            type="email"
            name="login"
            class="form-control"
            required
            value="{{ form_data.login if form_data else '' }}">

    </div>

    <div class="mb-3">

        <label class="form-label">
            Пароль
        </label>

        <input
            type="password"
            name="password"
            class="form-control"
            required>

    </div>

    <div class="mb-3">

        <label class="form-label">
            IMAP/SMTP сервер
        </label>

        <input
            type="text"
            name="server"
            class="form-control"
            value="{{ form_data.server if form_data else '' }}">

    </div>

    <div class="mb-3">

        <label class="form-label">
            Порт
        </label>

        <input
            type="number"
            name="port"
            class="form-control"
            value="{{ form_data.port if form_data else '' }}">

    </div>

    <div class="mb-4">

        <label class="form-label">
            Владелец почтового аккаунта
        </label>

        <select
            name="assigned_user_id"
            class="form-select">

            <option value="">
                Общий почтовый аккаунт
            </option>

            {% for item in users %}

                <option
                    value="{{ item.id }}"
                    {% if form_data
                        and form_data.assigned_user_id|string == item.id|string %}
                        selected
                    {% endif %}
                >
                    {{ item.name }}
                </option>

            {% endfor %}

        </select>

        <div class="form-text">
            Если владелец не выбран, почтовый аккаунт будет доступен всем пользователям.
        </div>

    </div>

    <button
        type="submit"
        class="btn btn-primary">

        Создать

    </button>

    <a
        href="/email-accounts"
        class="btn btn-outline-secondary">

        Отмена

    </a>

</form>

{% endblock %}
