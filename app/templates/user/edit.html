{% extends "base.html" %}

{% block title %}
Редактирование пользователя
{% endblock %}

{% block content %}

{% include "components/error_alert.html" %}

{% include "components/edit_form_start.html" %}

<div class="mb-3">

    <label class="form-label">
        Email
    </label>

    <input
        type="email"
        class="form-control"
        value="{{ template.email }}"
        disabled>

</div>

<div class="mb-3">

    <label class="form-label">
        Имя
    </label>

    <input
        type="text"
        name="name"
        class="form-control"
        value="{{ template.name }}"
        required>

</div>

<div class="mb-3">

    <label class="form-label">
        Фамилия
    </label>

    <input
        type="text"
        name="surname"
        class="form-control"
        value="{{ template.surname }}"
        required>

</div>

<div class="mb-3">

    <label class="form-label">
        Должность
    </label>

    <input
        type="text"
        name="position"
        class="form-control"
        value="{{ template.position }}"
        required>

</div>

<div class="mb-3">

    <label class="form-label">
        Подразделение
    </label>

    <select
        name="branch_id"
        class="form-select">

        {% for branch in branches %}

        <option
            value="{{ branch.id }}"
            {% if branch.id == template.branch_id %}selected{% endif %}>

            {{ branch.name }}

        </option>

        {% endfor %}

    </select>

</div>

<div class="mb-3">

    <label class="form-label">
        Роли
    </label>

    <div class="form-check">

        <input
            class="form-check-input"
            type="checkbox"
            name="role"
            value="admin"
            {% if "admin" in template.roles %}checked{% endif %}>

        <label class="form-check-label">
            Администратор
        </label>

    </div>

    <div class="form-check">

        <input
            class="form-check-input"
            type="checkbox"
            name="role"
            value="manager"
            {% if "manager" in template.roles %}checked{% endif %}>

        <label class="form-check-label">
            Менеджер
        </label>

    </div>

    <div class="form-check">

        <input
            class="form-check-input"
            type="checkbox"
            name="role"
            value="executor"
            {% if "executor" in template.roles %}checked{% endif %}>

        <label class="form-check-label">
            Исполнитель
        </label>

    </div>

</div>

{% include "components/edit_form_end.html" %}

{% endblock %}
