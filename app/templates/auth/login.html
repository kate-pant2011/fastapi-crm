{% extends "auth_base.html" %}

{% block title %}
Вход
{% endblock %}

{% block content %}

<h2>Вход в систему</h2>

{% if error %}
<div class="alert alert-danger">
    <strong>Ошибка:</strong>
    {{ error }}
</div>
{% endif %}

<form action="/auth/login-page" method="post">

    <div class="mb-3">
        <label class="form-label">
            Email
        </label>

        <input
            type="email"
            name="email"
            class="form-control"
            value="{{ email or '' }}"
            required>
    </div>

<div class="mb-3">

    <label class="form-label">
        Пароль
    </label>

    <div class="input-group">

        <input
            type="password"
            id="password"
            name="password"
            class="form-control"
            required>

        <button
            type="button"
            class="btn btn-outline-secondary"
            onclick="togglePassword()">

            👁

        </button>

    </div>

</div>

    <button
        type="submit"
        class="btn btn-primary">

        Войти

    </button>

</form>

<hr>

<div class="mt-3">

    <a href="/auth/forgot-password">
        Забыли пароль?
    </a>

</div>

<div class="mt-2">

    <a href="/auth/signup">
        Регистрация компании
    </a>

</div>

<script>

function togglePassword() {

    const field = document.getElementById(
        "password"
    );

    if (field.type === "password") {
        field.type = "text";
    }
    else {
        field.type = "password";
    }

}

</script>

{% endblock %}
