{% extends "auth_base.html" %}

{% block title %}
Смена пароля
{% endblock %}

{% block content %}

<h2>Смена пароля</h2>

<p class="text-muted">
    Для первого входа необходимо установить новый пароль.
</p>

{% if error %}
<div class="alert alert-danger">
    <strong>Ошибка:</strong>
    {{ error }}
</div>
{% endif %}

<form action="/auth/change-password-page" method="post">

    <div class="mb-3">

        <label class="form-label">
            Новый пароль
        </label>

        <div class="input-group">

            <input
                type="password"
                id="password"
                name="password"
                class="form-control"
                required>

            <button
                type="button"
                class="btn btn-outline-secondary"
                onclick="togglePassword()">

                👁

            </button>

        </div>

    </div>

    <button
        type="submit"
        class="btn btn-primary">

        Сохранить пароль

    </button>

</form>

<script>

function togglePassword() {

    const field =
        document.getElementById(
            "password"
        );

    if (field.type === "password") {
        field.type = "text";
    }
    else {
        field.type = "password";
    }

}

</script>

{% endblock %}
