{% extends "base.html" %}

{% block title %}
Успешно
{% endblock %}

{% block content %}

{% include "components/error_alert.html" %}

<div class="card">

    <div class="card-header bg-success text-white">

        <h4 class="mb-0">

            ✅ Успешно

        </h4>

    </div>

    <div class="card-body text-center py-5">

        <h5 class="mb-4">

            {{ message }}

        </h5>

        {% if return_url %}

        <a
            href="{{ return_url }}"
            class="btn btn-primary">

            Продолжить

        </a>

        {% endif %}

    </div>

</div>

{% endblock %}
