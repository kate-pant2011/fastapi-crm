<!DOCTYPE html>
<html lang="ru">

<head>

    <meta charset="UTF-8">

    <title>

        {% block title %}
        CRM
        {% endblock %}

    </title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootswatch@5.3.8/dist/flatly/bootstrap.min.css"
        rel="stylesheet">

</head>

<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-primary">

    <div class="container-fluid">

        <span class="navbar-brand">

            CRM

        </span>

        <div class="d-flex align-items-center gap-2">

            <a
                href="/profile"
                class="btn btn-outline-light">

                👤 Профиль

            </a>

            <a href="/email-accounts" class="btn btn-outline-light">
                ⚙ Почтовые аккаунты
            </a>
            
            <a href="/email-logs" class="btn btn-outline-light">
                ✉ Журнал писем
            </a>

        </div>

        <div class="ms-auto d-flex align-items-center gap-2">

            <div class="dropdown">

                <button
                    class="btn btn-outline-light dropdown-toggle"
                    type="button"
                    data-bs-toggle="dropdown">

                    {% if mode == "execution" %}
                        Исполнение
                    {% else %}
                        Управление
                    {% endif %}

                </button>

                <ul class="dropdown-menu dropdown-menu-end">

                    <li>

                        <form
                            action="/switch-mode"
                            method="post">

                            <input
                                type="hidden"
                                name="mode"
                                value="management">

                            <button
                                type="submit"
                                class="dropdown-item">

                                Управление

                            </button>

                        </form>

                    </li>

                    <li>

                        <form
                            action="/switch-mode"
                            method="post">

                            <input
                                type="hidden"
                                name="mode"
                                value="execution">

                            <button
                                type="submit"
                                class="dropdown-item">

                                Исполнение

                            </button>

                        </form>

                    </li>

                </ul>

            </div>

            <form
                action="/auth/logout-page"
                method="post">

                <button
                    type="submit"
                    class="btn btn-outline-light fw-bold">

                    Выйти

                </button>

            </form>

        </div>

    </div>

</nav>

<div class="container mt-4">

    {% block content %}
    {% endblock %}

</div>

<footer
    class="border-top py-3"
    style="margin-top: 80px;">

    <div class="container">

        <div class="d-flex justify-content-between align-items-start">

            <div class="d-flex gap-2">

                <div class="dropdown">

                    <button
                        class="btn btn-outline-primary dropdown-toggle"
                        type="button"
                        data-bs-toggle="dropdown">

                        📄 Шаблоны

                    </button>

                    <ul class="dropdown-menu">

                        <li>

                            <a
                                class="dropdown-item"
                                href="/doc-templates">

                                Шаблоны документов

                            </a>

                        </li>

                        <li>

                            <a
                                class="dropdown-item"
                                href="/email-templates">

                                Шаблоны Email

                            </a>

                        </li>

                        <li>

                            <a
                                class="dropdown-item"
                                href="/stage-templates">

                                Шаблоны этапов

                            </a>

                        </li>

                        <li>

                            <a
                                class="dropdown-item"
                                href="/template-fields">

                                Доступные поля

                            </a>

                        </li>

                    </ul>

                </div>

                <div class="dropdown">

                    <button
                        class="btn btn-outline-primary dropdown-toggle"
                        type="button"
                        data-bs-toggle="dropdown">

                        Общее

                    </button>

                    <ul class="dropdown-menu">

                        <li>

                            <a
                                class="dropdown-item"
                                href="/branches">

                                Подразделения

                            </a>

                        </li>

                        <li>

                            <a
                                class="dropdown-item"
                                href="/contractors">

                                Подрядчики

                            </a>

                        </li>

                    </ul>

                </div>

            </div>

            <a
                href="/documents"
                class="btn btn-outline-success">

                📂 Сгенерированные документы

            </a>

        </div>

    </div>

</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.6/Sortable.min.js"></script>

</body>

</html>
